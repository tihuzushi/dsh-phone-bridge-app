<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HARNESS</title>
<link rel="stylesheet" href="offline.css">
</head>
<body data-theme="dark">
<div class="app">
  <aside class="side" id="sideDrawer" aria-hidden="true">
    <div class="side-brand">
      <span class="brand-mark">H</span>
      <span>HARNESS</span>
    </div>
    <button class="side-new" type="button" data-online-only>
      <span class="plus">+</span>
      <span>新建会话</span>
    </button>
    <button class="side-row" type="button" data-online-only><span>插件</span></button>
    <button class="side-row" type="button" data-online-only><span>自动化任务</span></button>
    <button class="side-row" type="button" data-online-only><span>更多</span></button>
    <div class="side-search" data-online-only>搜索会话</div>
    <div class="side-label">会话</div>
    <div class="side-empty">
      <span>暂无会话</span>
      <small>连接后显示电脑上的会话</small>
    </div>
    <button class="side-account" id="openSettings" type="button">
      <span class="side-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5"/>
        </svg>
      </span>
      <span class="side-account-copy"><b>未登录</b><small>点击进入设置</small></span>
    </button>
  </aside>
  <div class="side-backdrop" id="sideBackdrop" hidden></div>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn" id="menuButton" type="button" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="brand">HARNESS</div>
      <div class="top-actions">
        <button class="icon-btn" type="button" aria-label="更多" data-online-only>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="右侧边栏" data-online-only>
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M15.5 4.5v15"/></svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <div class="welcome">
        <div class="welcome-title-row">
          <svg class="whale" width="34" height="25" viewBox="0 0 23.16 17.04" fill="none" aria-hidden="true">
            <path d="M22.9168 1.43018C22.6713 1.31018 22.5658 1.53918 22.4223 1.65519C22.3733 1.69269 22.3318 1.74169 22.2903 1.78669C21.9317 2.1697 21.5127 2.42121 20.9657 2.39121C20.1657 2.34621 19.4827 2.59771 18.8787 3.20973C18.7502 2.45521 18.3236 2.0047 17.6746 1.71569C17.3351 1.56568 16.9916 1.41518 16.7536 1.08867C16.5876 0.856163 16.5421 0.597155 16.4591 0.341647C16.4061 0.187643 16.3536 0.0301382 16.1761 0.00363739C15.9836 -0.0263635 15.9081 0.135141 15.8326 0.270145C15.5306 0.822162 15.4136 1.43018 15.4251 2.0462C15.4516 3.43174 16.0366 4.53527 17.1991 5.3203C17.3311 5.4103 17.3651 5.5003 17.3236 5.63181C17.2441 5.90231 17.1501 6.16482 17.0671 6.43533C17.0141 6.60784 16.9351 6.64584 16.7501 6.57033C16.1121 6.30383 15.5611 5.90931 15.074 5.4328C14.2475 4.63328 13.5 3.75075 12.568 3.05973C12.349 2.89822 12.13 2.74822 11.9034 2.60522C10.9524 1.68169 12.028 0.923165 12.277 0.833162C12.5375 0.739159 12.3675 0.41615 11.5259 0.42015C10.6844 0.42365 9.91439 0.705658 8.93286 1.08117C8.78935 1.13767 8.63835 1.17867 8.48384 1.21267C7.59332 1.04367 6.66829 1.00617 5.70226 1.11517C3.88321 1.31768 2.43016 2.1777 1.36213 3.64575C0.0790928 5.4103 -0.222916 7.41536 0.146595 9.50642C0.535106 11.7105 1.66014 13.535 3.38869 14.9616C5.18125 16.4406 7.24581 17.1657 9.60138 17.0266C11.0319 16.9441 12.6245 16.7526 14.421 15.2321C14.874 15.4576 15.3496 15.5476 16.1381 15.6151C16.7456 15.6716 17.3306 15.5851 17.7836 15.4911C18.4931 15.3411 18.4441 14.6841 18.1876 14.5636C16.1081 13.595 16.5646 13.9891 16.1496 13.67C17.2061 12.42 18.8202 10.1979 19.3182 7.17235C19.3672 6.83834 19.4297 6.36783 19.4222 6.09732C19.4182 5.93231 19.4562 5.86831 19.6447 5.84931C20.1657 5.78931 20.6712 5.64681 21.1357 5.3913C22.4833 4.65528 23.0268 3.44624 23.1548 1.9972C23.1738 1.77569 23.1508 1.54668 22.9168 1.43018ZM11.1749 14.4736C9.15936 12.889 8.18184 12.3675 7.77832 12.39C7.40081 12.4125 7.46881 12.8445 7.55182 13.126C7.63882 13.404 7.75182 13.5955 7.91033 13.8396C8.01983 14.0011 8.09533 14.2411 7.           </svg>
          <h1>探索未至之境</h1>
          <span class="preview-badge">预览版</span>
        </div>
        <div class="context-row">
          <button type="button" class="context-item" data-requires-online>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
            <span>默认工作区</span><span class="chev">⌄</span>
          </button>
          <button type="button" class="context-item" data-requires-online>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3"/><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5"/></svg>
            <span>标准模式</span><span class="chev">⌄</span>
          </button>
        </div>
      </div>

      <div class="composer-ghost" data-requires-online>
        <div class="composer-ghost-text">描述你想要构建的内容，/ 调用指令，@ 文件或对话</div>
        <div class="composer-ghost-row">
          <span class="composer-plus">+</span>
          <span class="composer-chip"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l7 3v5c0 4.4-3 8.1-7 9.5-4-2.4-7-5.1-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg><span class="chev">⌄</span></span>
          <span class="composer-chip composer-chip-model"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h16v11H4z"/><path d="M8 8V5h8v3"/></svg><span class="chev">⌄</span></span>
          <span class="send-ghost">↑</span>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="overlay hidden" id="settingsOverlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <header class="sheet-head">
      <h2 id="settingsTitle">设置</h2>
      <button class="icon-btn" id="closeSettings" type="button" aria-label="关闭">×</button>
    </header>

    <nav class="settings-tabs" role="tablist" aria-label="设置分类">
      <button type="button" role="tab" data-settings-tab="account">账号与余额</button>
      <button type="button" role="tab" data-settings-tab="general" class="selected">通用设置</button>
      <button type="button" role="tab" data-settings-tab="models">模型</button>
      <button type="button" role="tab" data-settings-tab="plugins">内置插件</button>
      <button type="button" role="tab" data-settings-tab="agents">Agent 预设</button>
      <button type="button" role="tab" data-settings-tab="connection">连接设置</button>
    </nav>

    <div class="sheet-body">
      <div class="settings-panel" data-settings-panel="account" hidden>
      <section class="section">
        <div class="account-row" data-requires-online>
          <div class="account-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
              <circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-4 3.1-6.5 7-6.5s7 2.5 7 6.5"/>
            </svg>
          </div>
          <div class="account-copy">
            <div class="account-name">账户与余额</div>
            <div class="hint">未登录 · 请先连接</div>
          </div>
        </div>
        <button class="offline-setting" type="button" data-online-only><span>更多账号信息</span><small>请先连接</small></button>
        <button class="offline-setting" type="button" data-online-only><span>充值余额</span><small>¥0.00</small></button>
        <button class="offline-setting" type="button" data-online-only><span>查询用量</span><small>请先连接</small></button>
        <button class="offline-setting" type="button" data-online-only><span>退出登录</span><small>请先连接</small></button>
      </section>
      </div>

      <div class="settings-panel" data-settings-panel="general">

      <section class="section">
        <div class="section-title">外观</div>
        <div class="segmented" role="group" aria-label="外观">
          <button type="button" data-theme-choice="light">浅色</button>
          <button type="button" data-theme-choice="dark">深色</button>
          <button type="button" data-theme-choice="system">跟随系统</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">语言</div>
        <div class="segmented" id="languageSwitch" role="group" aria-label="语言">
          <button type="button" data-language="zh">中文</button>
          <button type="button" data-language="en">English</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">字号大小</div>
        <div class="offline-font-row">
          <input class="input offline-font-input" id="offlineFontSize" type="number" min="10" max="28" step="1" inputmode="numeric" aria-label="字号大小">
          <span class="hint">px</span>
          <button class="btn offline-font-step" type="button" data-font-step="1">+</button>
          <button class="btn offline-font-step" type="button" data-font-step="-1">−</button>
        </div>
      </section>

      <section class="section">
        <div class="section-title">通用</div>
        <button class="offline-setting" type="button" data-online-only><span>权限</span><small>工作区内修改</small></button>
        <button class="offline-setting" type="button" data-online-only><span>工作步骤展示</span><small>详细</small></button>
        <button class="offline-setting" type="button" data-online-only><span>工作步骤收起时机</span><small>回答结束后</small></button>
        <button class="offline-setting" type="button" data-online-only><span>显示代码工作视图</span><small>请先连接</small></button>
        <button class="offline-setting" type="button" data-online-only><span>繁忙时的发送行为</span><small>排队发送</small></button>
        <button class="offline-setting" type="button" data-online-only><span>性能与用量</span><small>详细</small></button>
        <button class="offline-setting" type="button" data-online-only><span>上传 Session Log</span><small>请先连接</small></button>
      </section>

      <section class="section">
        <div class="offline-download-row">
          <div class="offline-download-copy">
            <div class="offline-download-label">下载的文件</div>
            <div class="hint">用文件管理器打开下载文件夹</div>
          </div>
          <button class="btn offline-download-btn" id="offlineOpenDownloads" type="button" aria-label="打开下载文件夹">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/>
              <path d="M3 10h18"/>
            </svg>
          </button>
        </div>
      </section>
      </div>

      <div class="settings-panel" data-settings-panel="connection" hidden>
        <section class="section">
          <div class="section-title">连接 HARNESS</div>
          <div class="status-row">
            <span>Tailscale</span>
            <span id="tsStatus">读取中…</span>
          </div>
          <div class="row">
            <button class="btn primary" id="loginBtn" type="button">登录 Tailscale</button>
            <button class="btn hidden" id="logoutBtn" type="button">退出登录</button>
          </div>
          <div class="segmented mode-switch" id="modeSwitch" role="group" aria-label="连接方式">
            <button type="button" data-mode="tsnet">内置 Tailscale</button>
            <button type="button" data-mode="direct">局域网直连</button>
          </div>
          <div class="hint" id="deviceHint">登录后自动读取 Tailscale 设备。</div>
          <div class="devices" id="devices"></div>
          <label class="check">
            <input type="checkbox" id="manualCheck">
            <span>手动输入 IP（可选）</span>
          </label>
          <input class="input" id="manualTarget" type="text" inputmode="url" autocomplete="off"
                 placeholder="例如 100.64.0.1 或 192.168.1.10:8765">
          <label class="field-label" for="pairCode">配对码</label>
          <input class="input code" id="pairCode" type="text" inputmode="numeric" maxlength="6"
                 autocomplete="off" placeholder="6 位数字">
          <button class="btn primary wide" id="connectBtn" type="button">保存并连接</button>
          <div class="hint" id="configHint"></div>
        </section>
        <section class="section">
          <div class="section-title">当前连接</div>
          <div class="hint" id="currentConnection">尚未连接</div>
          <div class="row">
            <button class="btn" id="refreshBtn" type="button">刷新页面</button>
            <button class="btn" id="repairBtn" type="button">重新配对</button>
          </div>
        </section>
      </div>

      <div class="settings-panel" data-settings-panel="models" hidden>
        <section class="section">
          <div class="section-title">模型</div>
          <div class="hint">连接后显示电脑上的模型与推理等级。</div>
          <button class="offline-setting" type="button" data-online-only><span>DeepSeek-V4.1-Flash</span><small>Max</small></button>
          <button class="offline-setting" type="button" data-online-only><span>推理等级</span><small>Max</small></button>
          <button class="offline-setting" type="button" data-online-only><span>选择模型</span><small>请先连接</small></button>
        </section>
      </div>
      <div class="settings-panel" data-settings-panel="plugins" hidden>
        <section class="section">
          <div class="section-title">内置插件</div>
          <div class="hint">连接后管理电脑上的插件。</div>
          <button class="offline-setting" type="button" data-online-only><span>已安装插件</span><small>请先连接</small></button>
          <button class="offline-setting" type="button" data-online-only><span>插件市场</span><small>请先连接</small></button>
          <button class="offline-setting" type="button" data-online-only><span>插件列表</span><small>请先连接</small></button>
        </section>
      </div>
      <div class="settings-panel" data-settings-panel="agents" hidden>
        <section class="section">
          <div class="section-title">Agent 预设</div>
          <div class="hint">连接后选择 Agent 预设。</div>
          <button class="offline-setting" type="button" data-online-only><span>默认预设</span><small>请先连接</small></button>
          <button class="offline-setting" type="button" data-online-only><span>代码代理</span><small>请先连接</small></button>
          <button class="offline-setting" type="button" data-online-only><span>选择预设</span><small>请先连接</small></button>
        </section>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="offline.js"></script>
</body>
</html>
